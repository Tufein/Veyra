plugins { id 'com.android.application' }

android {
    namespace 'nl.veyra.browser'
    compileSdk { version = release(37) { minorApiLevel = 2 } }

    defaultConfig {
        applicationId 'nl.veyra.browser'
        minSdk 28
        targetSdk 35
        versionCode 9
        versionName '1.0.0-rc.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        stable {
            def path = providers.environmentVariable('VEYRA_SIGNING_STORE_FILE').orNull
            if (path != null) {
                storeFile file(path)
                storePassword providers.environmentVariable('VEYRA_SIGNING_STORE_PASSWORD').get()
                keyAlias providers.environmentVariable('VEYRA_SIGNING_KEY_ALIAS').get()
                keyPassword providers.environmentVariable('VEYRA_SIGNING_KEY_PASSWORD').get()
            }
        }
    }
    buildTypes {
        debug {
            if (providers.environmentVariable('VEYRA_SIGNING_STORE_FILE').isPresent()) signingConfig signingConfigs.stable
        }
        release {
            debuggable false
            if (providers.environmentVariable('VEYRA_SIGNING_STORE_FILE').isPresent()) signingConfig signingConfigs.stable
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint { abortOnError true }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.mozilla.geckoview:geckoview:158.0.20261021001945'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

// Exercise release configuration with host tests as well as the default debug variant.
androidComponents.beforeVariants(androidComponents.selector().withBuildType('release')) { variant ->
    variant.enableUnitTest = true
}

// Keep the existing attributed snapshot as the single source for both blockers.
abstract class PrepareProtectionAssets extends DefaultTask {
    @InputFile abstract RegularFileProperty getHostsFile()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()
    @TaskAction void prepare() {
        def target = outputDirectory.file('veyra-protection/hosts.txt').get().asFile.toPath()
        java.nio.file.Files.createDirectories(target.parent)
        java.nio.file.Files.copy(hostsFile.get().asFile.toPath(), target,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}
def protectionAssets = tasks.register('prepareProtectionAssets', PrepareProtectionAssets) {
    hostsFile.set(layout.projectDirectory.file('src/main/assets/adblock-hosts.txt'))
    outputDirectory.set(layout.buildDirectory.dir('generated/protectionAssets'))
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.assets.addGeneratedSourceDirectory(protectionAssets, { it.outputDirectory })
}

// Robolectric's Android framework artifacts use the same verified Maven Central route.
tasks.withType(Test).configureEach {
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
}

// Robolectric changes process-wide security providers. Keep real TLS traffic in its own JVM.
tasks.withType(Test).configureEach {
    if (name != 'syncHttpsIntegrationTest') exclude '**/SyncHttpsIntegrationTest.class'
}
tasks.register('syncHttpsIntegrationTest', Test) {
    def host = tasks.named('testDebugUnitTest', Test).get()
    dependsOn host
    testClassesDirs = host.testClassesDirs
    classpath = host.classpath
    include '**/SyncHttpsIntegrationTest.class'
    useJUnit()
}
tasks.matching { it.name == 'check' }.configureEach { dependsOn 'syncHttpsIntegrationTest' }
